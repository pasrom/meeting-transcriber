name: "Setup Swift test environment"
description: >
  Checks out the repo, restores SPM and ML-model caches keyed off
  `Package.resolved`, and pre-warms the ML model cache on a cache miss.
  Used by every job that runs `swift test` against engines that load
  WhisperKit / FluidAudio weights, so the boilerplate lives in
  one place instead of being copy-pasted per job.

inputs:
  cache-key-suffix:
    description: >
      Distinguishes parallel SPM caches by compile-flag set. Pick a stable
      string like `homebrew`, `appstore`, `tsan`, `asan`, `quality`, or
      `release-homebrew`. Different suffixes get independent caches; same
      suffix can share. A release build and a test build must not share one:
      they fill `.build` with different products, and whichever job saved
      first would decide what the other restores.
    required: true
  cache-restore-fallback:
    description: >
      Fall back to the newest cache of the same suffix when the exact key
      (suffix + manifests and `Package.resolved` hash) misses. Anything but
      `true` restores the exact dependency set or nothing, never objects built
      against older ones.
    required: false
    default: "true"
  cache-spm:
    description: >
      Restore and save the SPM build cache. Anything but `true` skips both, so
      the build starts cold and leaves no cache behind (a malformed value fails
      toward the cold build, not toward a warm one). Does not affect the model
      cache.
    required: false
    default: "true"
  cache-path:
    description: >
      The SwiftPM scratch directory to cache. build_release.sh builds the App
      Store variant in `app/MeetingTranscriber/.build-appstore`, so that leg
      passes that directory. The path is part of the cache version, so
      changing it for one caller leaves the other callers' caches alone.
    required: false
    default: app/MeetingTranscriber/.build
  swift-flags:
    description: >
      Extra arguments forwarded to the pre-warm `swift test` invocation
      (e.g. `-Xswiftc -DAPPSTORE`). Sanitizer flags are intentionally NOT
      applied to the pre-warm — the model loader doesn't need them, and
      sanitized builds are slower to warm.
    required: false
    default: ""
  cache-models:
    description: >
      Cache the ML model directories and pre-warm them on cache miss.
      Set to `false` for build-only jobs (release.yml) that don't load
      models — skips both the cache restore and the prewarm step.
    required: false
    default: "true"

outputs:
  toolchain:
    description: >
      The compiler identity used in the cache keys, e.g.
      `Xcode-27.0-Build-version-27A266a`, for a caller that keys a cache of
      its own on it. Empty when `cache-spm` is not `true`: the step is skipped
      then, so a build that uses no cache cannot fail over a key it never reads.
    value: ${{ steps.toolchain.outputs.id }}

runs:
  using: "composite"
  steps:
    # Caller is responsible for `actions/checkout` before invoking this
    # action — GitHub loads `./.github/actions/...` from the workspace, so
    # the repo must already be present.
    #
    # The key carries the compiler the build runs under, as its version and
    # build number (`Xcode-27.0-Build-version-27A266a`), not the Xcode path. A
    # tree built by another compiler is discarded by SwiftPM, and an exact hit
    # is never saved again, so without it a toolchain bump would leave every
    # run restoring a tree it cannot use until `Package.resolved` changes. The
    # path does not tell compilers apart: a new build installed under the same
    # path would keep the old key. A shell step inherits the caller's
    # DEVELOPER_DIR for certain, which `xcodebuild` honours; the docs do not
    # say whether the `env` context of a composite action does.
    #
    # Fails closed. An empty or unreadable answer would otherwise build a key
    # with no toolchain in it and quietly bring the stale-tree problem back, so
    # the step stops instead, and so does a failing `xcodebuild` (pipefail).
    # Skipped when `cache-spm` is off (a published release build), so a key it
    # never reads cannot fail that build.
    - name: Identify the toolchain for the cache key
      id: toolchain
      if: inputs.cache-spm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Two lines, "Xcode 27.0" and "Build version 27A266a", joined into one
        # key-safe word: runs of blanks and newlines become one dash.
        id=$(xcodebuild -version | tr -s '[:space:]' '-')
        id=${id%-}
        if [[ ! $id =~ ^[A-Za-z0-9._-]+$ || $id != *Build-version-* ]]; then
          echo "::error::Cannot build a cache key from 'xcodebuild -version' (got: '$id')"
          exit 1
        fi
        echo "id=$id" >> "$GITHUB_OUTPUT"

    # Keyed off the manifests as well as `Package.resolved`: a changed binary
    # target (URL or checksum) leaves `Package.resolved` alone, so the key
    # would still hit exactly, SwiftPM would fetch the new artifact, and the
    # entry would never be saved again. These are the two manifests of the
    # packages that go into this build tree: the app and its local dependency
    # AudioTapLib. The simulator and mt-cli are separate packages with trees
    # of their own.
    - name: Cache SPM dependencies
      if: inputs.cache-spm == 'true'
      uses: actions/cache@v5
      with:
        path: ${{ inputs.cache-path }}
        key: spm-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ inputs.cache-key-suffix }}-${{ hashFiles('app/MeetingTranscriber/Package.resolved', 'app/MeetingTranscriber/Package.swift', 'tools/audiotap/Package.swift') }}
        restore-keys: ${{ inputs.cache-restore-fallback == 'true' && format('spm-{0}-{1}-{2}-', runner.os, steps.toolchain.outputs.id, inputs.cache-key-suffix) || '' }}

    # Cache the WhisperKit (HuggingFace) + FluidAudio model files. The
    # HuggingFace download client races on cold-cache concurrent loads of
    # the same variant; pre-warming sequentially populates the cache so
    # the parallel run can hit it. After the first successful CI run the
    # cache is populated and the preload step is skipped.
    #
    # The cache key also hashes `ModelPreloadTests.swift` so that adding a
    # new pre-warm test (a new model FluidAudio downloads from a separate
    # HF repo, e.g. Silero VAD, or the Parakeet EOU 320ms streaming model)
    # invalidates the cache and forces a fresh pre-warm. Without that, a
    # `Package.resolved` that hasn't changed would let a stale cache from
    # before the new model was added persist, and the un-pre-warmed model
    # would race + hit HF rate limits under parallel xctest. The trailing
    # `-vN` suffix is a manual belt-and-braces bump for the same reason
    # (bumped to v2 when the EOU 320ms streaming model was added to
    # `ModelPreloadTests.testPreloadEouStreaming`, to v3 when WhisperKit
    # models moved out of ~/Documents/huggingface, issue #640).
    - name: Cache ML models
      id: model-cache
      if: inputs.cache-models == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/Library/Application Support/MeetingTranscriber/huggingface
          ~/Library/Application Support/FluidAudio
        key: ml-models-${{ runner.os }}-${{ hashFiles('app/MeetingTranscriber/Package.resolved', 'app/MeetingTranscriber/Tests/ModelPreloadTests.swift') }}-v3
        restore-keys: ml-models-${{ runner.os }}-

    # Pre-warm step has no per-step `timeout-minutes` — composite actions
    # don't support it. Callers should set `timeout-minutes` on the
    # outer `uses: ./.github/actions/setup-swift-test` step to bound the
    # cold-cache HuggingFace + FluidAudio download.
    #
    # The script (shared with runner-home) retries a transient download
    # failure once, with a warning, and fails without a retry if
    # `ModelPreloadTests` is renamed or removed; see its header. No marker:
    # the cache above decides when this runs.
    - name: Pre-warm model cache (cache miss only)
      if: inputs.cache-models == 'true' && steps.model-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SWIFT_FLAGS: ${{ inputs.swift-flags }}
      run: |
        set -euo pipefail
        cd app/MeetingTranscriber
        # Split into words without glob expansion. The `+` form keeps an
        # empty list from tripping `set -u` on the system bash 3.2.
        read -ra flags <<< "$SWIFT_FLAGS"
        "$GITHUB_WORKSPACE/scripts/ci/prewarm-models.sh" ${flags[@]+"${flags[@]}"}
