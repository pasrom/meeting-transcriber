name: "Cancel run on failure"
description: >
  Cancels sibling jobs in the current workflow run when the calling job
  has failed. The workflow-level `concurrency` block only cancels
  superseded runs of the same ref — it doesn't react to a single job
  failing inside a run, so this composite fills the gap.

  The caller owns the condition (composite actions cannot have a
  top-level step-level `if`). Cancelling throws away every sibling job's
  work, so it should fire only when a step whose failure makes that work
  pointless failed, typically the build or tests:
  `if: failure() && steps.<id>.outcome == 'failure'`. Setup, download
  and upload failures should fail only their own job. The inner step
  swallows errors via continue-on-error so a transient gh CLI hiccup
  doesn't mask the original failure. A job whose failure already blocks
  the merge as a required check, and says nothing about the other jobs
  (lint, analyze), should not call this at all.
  Every caller needs `actions: write`; fork pull_request tokens are
  read-only, so there the cancel step fails and is tolerated.

  The run-level cancellation races the calling job's own conclusion:
  the culprit job usually ends up marked `cancelled` like its victims,
  hiding which job actually failed. The annotation + step-summary line
  emitted before cancelling survive that repaint and name the culprit
  in the run summary.

inputs:
  job-name:
    description: >
      Human-readable name of the failing job for the culprit annotation.
      Matrix jobs should pass the expanded name (e.g. "test (appstore)")
      because `github.job` only carries the job key.
    required: false
    default: ${{ github.job }}

runs:
  using: "composite"
  steps:
    - name: Name the culprit before cancelling
      shell: bash
      continue-on-error: true
      run: |
        echo "::error title=Run cancelled by failing job::'${JOB_NAME}' failed and cancelled this run — sibling jobs marked 'cancelled' are victims, not causes."
        echo "### ⚠️ Run cancelled by failing job: \`${JOB_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "Sibling jobs marked \`cancelled\` are victims, not causes." >> "$GITHUB_STEP_SUMMARY"
      env:
        JOB_NAME: ${{ inputs.job-name }}
    - name: Cancel current workflow run
      shell: bash
      continue-on-error: true
      run: gh run cancel "$RUN_ID"
      env:
        RUN_ID: ${{ github.run_id }}
        GH_TOKEN: ${{ github.token }}
