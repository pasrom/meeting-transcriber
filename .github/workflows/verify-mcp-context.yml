name: MCP context macOS verification

on:
  push:
    branches: [ci/mcp-context-78ff0116]

permissions:
  contents: read

jobs:
  test:
    name: MCP and Swift tests (${{ matrix.variant }})
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: homebrew
            swift-flags: ""
          - variant: appstore
            swift-flags: "-Xswiftc -DAPPSTORE"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f68915f3bc573ed5bfe225ec8d6f660e6c6dbac8
          persist-credentials: false

      - name: Verify source and toolchain
        run: |
          test "$(git rev-parse HEAD)" = f68915f3bc573ed5bfe225ec8d6f660e6c6dbac8
          xcodebuild -version
          swift --version

      - name: Run MCP tests
        timeout-minutes: 15
        working-directory: app/MeetingTranscriber
        run: swift test ${{ matrix.swift-flags }} --filter 'MCPOAuthTests|ContextMCPTests|ContextPolicyTests|PipelineMeetingContextTests|NotesFromTranscriptTests'
