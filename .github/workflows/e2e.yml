name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Transcription engine filter (WhisperKit, Parakeet, WatchLoop, or all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - WhisperKit
          - Parakeet
          - WatchLoop
  push:
    # Trigger on every main push so the engine E2E run produces a status
    # check on the same SHA that a future `v*` tag will point at. Tag
    # rulesets can then gate on this check without falling into the
    # chicken-and-egg of "tag fires e2e.yml, tag rejected because e2e.yml
    # hasn't run yet." No paths-filter: the test is cheap on the Mini
    # (~2-3 min, generic-label runner), so the few wasted runs on
    # docs-only commits are not worth the complexity of keeping the
    # filter in sync across workflows.
    #
    # No `tags: ["v*"]` here either: a tag push on the same SHA as a prior
    # main push would NOT be cancelled by the concurrency group (different
    # `github.ref` between `refs/heads/main` and `refs/tags/v…`), so it
    # would fire a duplicate engine E2E run that the tag ruleset already
    # has covered via the main-push check-run.
    branches: [main]
  # Label-gated PR runs, same-repo branches only (this lane executes PR code
  # on the self-hosted Mini, so fork PRs are excluded — same rationale as
  # e2e-app.yml). The job below only executes when the `run-e2e` label is
  # present, giving pre-merge feedback from the fixture E2E lane without
  # waiting for the post-merge main-push run. `labeled` is included so
  # applying the label to an already-open PR starts the run immediately.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# PR runs land in their own group (github.ref = refs/pull/<n>/merge), so they
# can never cancel a main-push run (refs/heads/main is a distinct group).
# Within a PR group only `synchronize` (new commits) supersedes the in-flight
# run: `labeled` fires for ANY label addition, so cancelling on it would kill
# an in-flight run just because an unrelated label arrived. Push/dispatch
# events keep the old unconditional cancel (back-to-back main pushes
# supersede the stale run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action == 'synchronize' }}

jobs:
  e2e:
    # Non-PR events (push/dispatch) always run. PR events run only for
    # same-repo branches carrying the `run-e2e` label; the label-name check
    # keeps `labeled` events for any OTHER label from starting a duplicate.
    if: |
      github.event_name != 'pull_request' ||
      (
        contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'run-e2e')
      )
    runs-on: [self-hosted, macOS, ARM64]
    # Cold-cache runs download multi-GB models (WhisperKit ~1 GB,
    # Parakeet ~50 MB); hot runs <10 min. The runner-home pre-warm (20 min)
    # and the `Run E2E tests` step (25 min) each carry a step-timeout so a
    # hang surfaces as `timed_out`; the job budget holds both.
    timeout-minutes: 50
    env:
      E2E_ENABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify-xcode

      - name: Resolve test filter
        id: filter
        run: |
          ENGINE="${{ github.event.inputs.engine || 'all' }}"
          if [ "$ENGINE" = "all" ]; then
            FILTER="E2E"
          else
            FILTER="${ENGINE}E2E"
          fi
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          echo "Running E2E tests with filter: $FILTER"

      # No actions/cache here: the self-hosted Mini has persistent disk
      # between runs, so the SPM `.build` directory and the on-disk model
      # caches are already populated. actions/cache would re-download
      # via HTTPS on hit and waste the multi-GB upload on miss — the
      # latter timed out the post-action on a real run (5.6 GB → GitHub).
      #
      # Those caches are in the runner's own test home (see the action). The
      # run is serial, so a cold home would not race, but the test step's 25
      # min are sized for warm models: the pre-warm fetches them in a step of
      # its own instead, bounded separately and reusing this lane's build, and
      # is a file check once warm. It fetches every pre-warmed model, also for
      # a dispatch narrowed to one engine: a one-time cost per runner home.
      - id: home
        uses: ./.github/actions/runner-home
        timeout-minutes: 20
        with:
          prewarm: "true"

      # RunnerHomeIsolationTests is added to the filter so this lane, too,
      # fails if it ever runs in the account's real home.
      - name: Run E2E tests
        timeout-minutes: 25
        env:
          CFFIXED_USER_HOME: ${{ steps.home.outputs.home }}
        run: |
          cd app/MeetingTranscriber
          swift test --filter '${{ steps.filter.outputs.filter }}|RunnerHomeIsolationTests'
