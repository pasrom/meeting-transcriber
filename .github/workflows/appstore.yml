name: App Store Smoke

# Builds the App Store variant of the .app (sandbox + restricted entitlements,
# `#if APPSTORE` source branches active) and verifies that the signed bundle
# carries exactly the committed entitlements, that it launches without
# crashing within the first 5 s, and that it keeps its data in its sandbox
# container (scripts/appstore-bundle-check.sh).
#
# Why this exists: the `--appstore` build path has zero automated coverage
# beyond compilation. Sandbox-rejected operations, `#if APPSTORE` regressions
# in record-only output paths, broken dynamic linking, or wrong deployment
# target all surface only at launch — and previously only when a human
# happened to test the App Store variant. This workflow catches that class
# of breakage on every push to main and nightly.

on:
  workflow_dispatch:
  pull_request:
    # Self-validate any PR that touches this workflow or the build script.
    # Other PRs are NOT burdened — keeps the hosted macOS runner budget for the
    # cases where it actually matters.
    paths:
      - '.github/workflows/appstore.yml'
      - 'scripts/build_release.sh'
      - 'scripts/appstore-bundle-check.sh'
      # The entitlement check compares against this file, so an edit to it
      # has to prove the signed bundle still matches.
      - 'app/MeetingTranscriber/Entitlements/AppStore.entitlements'
      # The launch check finds the app's data through the liveness marker,
      # so a PR that renames or moves it must prove the check still holds.
      - 'app/MeetingTranscriber/Sources/AppPaths.swift'
      - 'app/MeetingTranscriber/Sources/LivenessMarker.swift'
      - 'app/MeetingTranscriber/Sources/AppLauncher.swift'
      # A model-pin bump edits only these and changes what the bundle
      # contains, so filtering on build_release.sh alone would let a
      # broken revision or checksum reach a release untested.
      - 'scripts/fetch-localvqe-model.sh'
      - 'scripts/lib/localvqe-resources.sh'
  push:
    branches: [main]
    paths:
      - 'app/MeetingTranscriber/Sources/**'
      - 'app/MeetingTranscriber/Package.swift'
      - 'app/MeetingTranscriber/Package.resolved'
      - 'app/MeetingTranscriber/Entitlements/AppStore.entitlements'
      - 'app/MeetingTranscriber/Sources/Info.plist'
      - 'tools/audiotap/**'
      - 'scripts/build_release.sh'
      - 'scripts/appstore-bundle-check.sh'
      # A model-pin bump edits only these and changes what the bundle
      # contains, so filtering on build_release.sh alone would let a
      # broken revision or checksum reach a release untested.
      - 'scripts/fetch-localvqe-model.sh'
      - 'scripts/lib/localvqe-resources.sh'
      - '.github/workflows/appstore.yml'
  schedule:
    # 03:30 UTC sits between quality-and-safety (03:00) and e2e-app (04:30) so
    # concurrent failures are easy to disambiguate in `gh run list`.
    - cron: '30 3 * * *'

# Two parallel runs would race on the build dir and the launched app process.
concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: xcode-27
    env:
      # Xcode 27.0 by its own path rather than /Applications/Xcode.app: the image also
      # ships 27.1 and a 27.2 beta, and a moved default must never reach a build here.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify-xcode
        with:
          developer-dir: ${{ env.DEVELOPER_DIR }}

      # `--no-notarize` keeps the signing path on the ad-hoc fallback so we
      # don't need a Developer ID secret for a smoke run. `build_release.sh`
      # detects an empty DEVELOPER_ID and falls back automatically.
      - name: Build App Store variant
        run: ./scripts/build_release.sh --appstore --no-notarize

      # Why both checks exist and what they assert: scripts/appstore-bundle-check.sh.
      - name: Check signed entitlements
        run: |
          ./scripts/appstore-bundle-check.sh entitlements \
            "$GITHUB_WORKSPACE/.build/release/MeetingTranscriber.app" \
            app/MeetingTranscriber/Entitlements/AppStore.entitlements

      - name: Smoke-launch the .app and check its data location
        run: |
          ./scripts/appstore-bundle-check.sh launch \
            "$GITHUB_WORKSPACE/.build/release/MeetingTranscriber.app"

      - name: Upload crash reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/MeetingTranscriber-*.ips
          if-no-files-found: ignore
