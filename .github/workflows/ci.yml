name: CI

on:
  push:
    branches: [main, mac]
  pull_request:
    branches: [main]
  # Manual re-run knob (e.g. to re-trigger lint after a SwiftFormat config
  # bump). Background-QA jobs (sanitizer, quality) live in
  # `quality-and-safety.yml` with their own dispatch UI.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether anything outside docs/markdown changed. The filter only runs
  # for PR events; for push/tag/dispatch the step is skipped, leaving the step
  # output empty, and the job output falls back to 'true' so the full suite
  # always runs on non-PR triggers. Skipped required checks count as success
  # in branch protection, so docs-only PRs stay mergeable.
  # Jobs that depend on this one carry
  #   if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
  # and that shape is load-bearing in both halves.
  #
  # This job's whole purpose is to notice a docs-only change, and when it does
  # not SUCCEED every job that needs it is skipped -- while branch protection
  # and the stable-tag ruleset both count a skipped required check as a PASS.
  # A timeout here, an outage of the third-party filter action, or an API
  # hiccup would therefore turn the required checks green without one of them
  # having run, and a longer timeout only narrows that window.
  #
  # The mechanism is not that the outputs go empty. MEASURED on a throwaway
  # branch, with this job's step exiting 1: `outputs.code` came back as 'true'
  # through the fallback below, so `needs.changes.outputs.code == 'true'` was
  # TRUE, and the dependent job was skipped anyway. A job whose `needs` failed
  # is skipped before its condition decides anything, unless that condition
  # calls a status function. That is what `!cancelled()` is for, and it is the
  # half without which nothing else in the condition can be reached.
  #
  # The other half, `result != 'success'`, covers the case the measurement
  # above does not produce: a job that dies before finalising its outputs, on a
  # timeout, a cancellation or an infrastructure fault, where `code` really is
  # empty and the fallback never ran. Both halves are needed.
  #
  # `always()` would also reach the condition, and would additionally keep the
  # expensive macOS jobs running after someone cancels the run.
  #
  # A genuine docs-only PR still skips, which is the one case this job exists
  # for. scripts/tests/test_required_checks_fail_closed.sh pins the condition.
  changes:
    runs-on: ubuntu-latest
    # Seconds of work, but the budget has to cover a checkout and, here, a
    # third-party action; one minute was the tightest deadline in either file.
    # Two minutes is the slack the `changes` job in quality-and-safety.yml
    # carries, though for the opposite reason: a timeout there turns its gate
    # RED, while a timeout here is now merely expensive, since every dependent
    # job runs on a pull request that may have touched only documentation.
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # Needed so dorny/paths-filter can read .github/filters.yml from the
      # workspace; the action otherwise hits the GitHub API for the file
      # list but still needs the filter definition locally.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # `every` is required for the exclusion-style filter in
          # .github/filters.yml: with the v4 default `some`, the `**`
          # catch-all alone marks every file as matched and the `!…`
          # negations never actually exclude anything, so docs-only PRs
          # still trigger the full build/test suite.
          predicate-quantifier: every
          filters: .github/filters.yml

  # Advisory by design: this job is NOT among the required checks and must never
  # be the thing that stops a merge. `main` is not at stake either way, and
  # scripts/ci/check-merge-commits.sh carries the reason. What it protects is the
  # review of the open PR, which a merge commit makes unreadable commit by commit.
  #
  # Two deliberate choices, compared with the build and test jobs below:
  #   - No `Cancel run on failure` step (`lint` and `analyze` have none either).
  #     A check that blocks nothing must not take the macOS jobs down with it:
  #     the contributor still needs to see whether their actual change builds
  #     and passes.
  #   - Not gated on `changes`. A merge commit is worth reporting whichever files
  #     the PR touches, and this costs seconds on a free runner.
  merge-commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Three non-default inputs, each load-bearing. `ref`: the default
          # checkout for a pull_request event is refs/pull/N/merge, a merge commit
          # GitHub builds itself; measured on this repo, that ref carries a
          # `Merge <head> into <base>` commit, so the default would report every
          # PR. `fetch-depth: 0`: the depth-1 default carries neither the base
          # branch nor a merge base, so the commit range cannot resolve at all.
          # `filter: blob:none`: this walks commit topology only, so fetching
          # every historical file revision is dead weight.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      # The base branch comes from the event rather than a hardcoded `main`, so
      # widening the `pull_request` trigger later cannot leave this silently
      # measuring against the wrong base. Passed via env rather than interpolated
      # into the command line.
      - name: Check for merge commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/ci/check-merge-commits.sh "origin/$BASE_REF"

  lint:
    needs: changes
    # Fail closed; see the `changes` job for why this exact condition.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: xcode-27
    env:
      # Xcode 27.0 by its own path rather than /Applications/Xcode.app: the image also
      # ships 27.1 and a 27.2 beta, and a moved default must never reach a build here.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 10
    # No `Cancel run on failure` step, and so no `actions: write`: a required
    # check that blocks the merge on its own, and a red lint says nothing about
    # the build or tests the cancel would throw away (see that action's
    # description).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Both linters are pinned to an exact release *and* an exact checksum,
      # rather than installed with `brew install`. Why: scripts/tool-versions.sh.
      # How: scripts/ci/install-lint-tool.sh. Verification is a separate step
      # because $GITHUB_PATH only takes effect for *later* steps, so a check in
      # the install step would assert against the binary the pin replaces.
      - name: Install pinned lint tools
        run: |
          bash scripts/ci/install-lint-tool.sh swiftlint
          bash scripts/ci/install-lint-tool.sh swiftformat
      - name: Verify pinned lint tools
        run: |
          bash scripts/ci/install-lint-tool.sh swiftlint --verify
          bash scripts/ci/install-lint-tool.sh swiftformat --verify
      # SwiftFormat path list lives in scripts/lint.sh; calling it keeps CI and
      # local lint runs aligned. SwiftLint stays an explicit step to use the
      # github-actions-logging reporter (annotations in the PR diff).
      - name: SwiftFormat
        run: bash scripts/lint.sh --format-only
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      # Globbed, not enumerated: the list used to name two of the four files and
      # nobody noticed, and a script test nobody runs is indistinguishable from
      # no test at all. The naming pattern is therefore the contract — a
      # scripts/tests/test_*.sh must be self-contained and finish in about a
      # second. The step runs under `bash -e`, so the first failure stops it.
      - name: Script regression tests
        run: |
          for t in scripts/tests/test_*.sh; do
            echo "==> $t"
            bash "$t"
          done

  analyze:
    needs: changes
    # Fail closed; see the `changes` job for why this exact condition.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: xcode-27
    env:
      # Xcode 27.0 by its own path rather than /Applications/Xcode.app: the image also
      # ships 27.1 and a 27.2 beta, and a moved default must never reach a build here.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 30
    # No `Cancel run on failure` step, and so no `actions: write`, as in `lint`.
    # A compile error, the one failure this shares with `test`, fails the `test`
    # legs by itself.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned SwiftLint
        run: bash scripts/ci/install-lint-tool.sh swiftlint
      - name: Verify pinned SwiftLint
        run: bash scripts/ci/install-lint-tool.sh swiftlint --verify
      - name: Build & Analyze
        run: |
          # pipefail: without it `xcodebuild ... | tee` masks an xcodebuild
          # failure, leaving swiftlint analyze to pass against an empty log.
          set -o pipefail
          cd app/MeetingTranscriber
          # SWIFT_SUPPRESS_WARNINGS=NO: without it xcodebuild fails outright on
          # AudioTapLib's warning gate. Reason at the flag in
          # tools/audiotap/Package.swift.
          #
          # OTHER_SWIFT_FLAGS adds the per-body type-check timing print that the
          # report step below turns into a step summary. `$(inherited)` is
          # load-bearing: a command-line setting reaches every SPM target, and
          # without it the override would replace the package's own
          # -warn-long-function-bodies gate instead of sitting next to it
          # (verified on Xcode 26.6: both flags on the same compile command).
          # The compiler prints one line per body, some 33,000 across app and
          # dependencies, so the file keeps them and the console stream does
          # not. Clean build time was unchanged within noise.
          # shellcheck disable=SC2016  # $(inherited) is an Xcode setting reference, not a shell expansion
          xcodebuild -scheme MeetingTranscriber -destination 'platform=macOS' SWIFT_SUPPRESS_WARNINGS=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -debug-time-function-bodies' build-for-testing 2>&1 \
            | tee /tmp/xcodebuild.log | bash "$GITHUB_WORKSPACE/scripts/ci/type-check-timings.sh" strip
          cd "$GITHUB_WORKSPACE"
          # swiftlint analyze re-runs the compiler with the arguments it finds
          # in the log, timing flag included, so SourceKit prints the same lines
          # into swiftlint's output; stripped the same way. Its findings do not
          # change: output identical after the strip, +14 s on a 212 s run.
          swiftlint analyze --strict --compiler-log-path /tmp/xcodebuild.log --reporter github-actions-logging 2>&1 \
            | bash scripts/ci/type-check-timings.sh strip
      # Non-gating by construction: the 300 ms limit in Package.swift stays the
      # only enforcement. `continue-on-error` keeps any report problem from
      # failing the job, including the script's own exit 1 when it found no
      # timings, which then shows as a tolerated step failure plus a warning
      # annotation rather than as an empty table. Runs after a failed build
      # too: when the gate fires, the bodies measured before the error are
      # exactly the ones to read.
      - name: Report slowest type-checks
        if: success() || failure()
        continue-on-error: true
        run: bash scripts/ci/type-check-timings.sh report /tmp/xcodebuild.log --root "$GITHUB_WORKSPACE"

  test:
    needs: changes
    # Fail closed; see the `changes` job for why this exact condition.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: xcode-27
    env:
      # Xcode 27.0 by its own path rather than /Applications/Xcode.app: the image also
      # ships 27.1 and a 27.2 beta, and a moved default must never reach a build here.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    # 25 min job-timeout = 20 min setup (cold cache) + ~5 min margin. The
    # `Build tests` and `Swift tests` steps below have step-timeouts of
    # their own so a hang there surfaces as `timed_out` (clearly
    # distinguishable from cancellation), not the opaque `cancelled` a bare
    # job-timeout produces; on a cold cache the job budget, not a step's,
    # is still what runs out first.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    strategy:
      # Both Homebrew and AppStore variants must pass. fail-fast: false NOT to
      # keep the sibling running when a leg's build or tests fail — the
      # `Cancel run on failure` step below cancels the whole run then — but so
      # the failing leg runs that step and names itself the culprit in the run
      # summary, instead of being silently auto-cancelled by the matrix before
      # it can.
      fail-fast: false
      matrix:
        variant: [homebrew, appstore]
        include:
          - variant: homebrew
            swift-flags: ""
          - variant: appstore
            swift-flags: "-Xswiftc -DAPPSTORE"
    name: test (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v7
      # 20 min covers SPM + ML cache restore plus the cold-cache pre-warm
      # download; well below the 25 min job timeout so a hung download
      # surfaces as a step failure, not a job-timeout.
      - uses: ./.github/actions/setup-swift-test
        timeout-minutes: 20
        with:
          cache-key-suffix: ${{ matrix.variant }}
          swift-flags: ${{ matrix.swift-flags }}
      # The ffmpeg-tier tests fail on a runner without ffmpeg (see the action).
      - uses: ./.github/actions/setup-ffmpeg
      # Without this the echo-cancellation tests skip, which is how this
      # feature reached a review with single-digit patch coverage on the two
      # files that do the work. The gap is worse than the number: the library
      # checks a model against a SHA-256 list compiled into it, so a model the
      # linked library rejects fails only at load time — compiling stays green,
      # the tests skip, and both builds merely copy the file. `appstore.yml`
      # already downloads the same model through `build_release.sh`, so this
      # adds no network dependency that CI did not have.
      - name: Fetch the echo-cancellation model
        run: echo "MEETINGTRANSCRIBER_LOCALVQE_MODEL=$(./scripts/fetch-localvqe-model.sh)" >> "$GITHUB_ENV"
      # Build and run are separate steps so each has a timeout of its own and
      # the run summary shows where the time went. Step timeouts fail as
      # `timed_out`, which a bare job timeout would report as `cancelled`.
      - name: Build tests
        id: build-tests
        timeout-minutes: 15
        run: cd app/MeetingTranscriber && swift build --build-tests --enable-code-coverage ${{ matrix.swift-flags }}
      # Three shards for the runner's three vCPUs, not `swift test --parallel`,
      # which starts one process per test method; the header of
      # scripts/ci/test-shards.sh has the measurements and what the script
      # guarantees. `--coverage` leaves the `default.profdata` that export-lcov
      # reads. ModelPreloadTests is a cache pre-warm, not a test, and runs in
      # setup-swift-test on a cache miss. 15 min step-timeout: the first hosted
      # runs took 2 min (homebrew) and 4.5 min (appstore) on a hot cache, and
      # the two legs' runners differed by 2x on a similar test count, so this
      # is ~3x margin over the slow leg while still failing as `timed_out`.
      # `--out` keeps the logs and raw profiles outside `.build`, which the
      # SPM cache would otherwise save and restore.
      - name: Swift tests
        id: swift-tests
        timeout-minutes: 15
        run: cd app/MeetingTranscriber && ../../scripts/ci/test-shards.sh run --shards 3 --skip ModelPreloadTests --coverage --out "$RUNNER_TEMP/test-shards"
      # The shard logs are what `test-shards.sh weights` regenerates the weights
      # file from, and a plan is only balanced for the machine the weights were
      # measured on, so the logs of this runner are kept. On a red run they also
      # hold more of a dead shard than the 300 lines the step prints.
      - name: Keep the shard logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-logs-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/test-shards/shard-*.log
            ${{ runner.temp }}/test-shards/plan.tsv
          if-no-files-found: ignore
          retention-days: 14
      # `tools/mt-cli` has its own test target, and until now nothing built it:
      # `swift build` skips test targets, and the only gate that touched the
      # test FILES was scripts/lint.sh, which formats and lints them without
      # type-checking them against the code they test. The e2e lanes build the
      # package, none of them with `swift test` or `--build-tests`. So its tests
      # could not have failed.
      #
      # They run here rather than in a job of their own because this one is a
      # required check. `audiotap-coverage` is the obvious template and is not
      # required: it relies on cancel-on-failure, which only reaches jobs still
      # running, so a late failure leaves already-successful required checks
      # green and the pull request mergeable. Homebrew leg only: mt-cli is a
      # development client with no App Store variant, so the appstore leg would
      # repeat the identical run. About 13 s cold, 31 tests.
      #
      # Its build tree is cached under a key that covers everything that goes
      # into it (compiler, manifest, dependencies, sources, tests), with no
      # fallback to an older tree: a hit is exactly this build, any change is a
      # cold build. Uncached, this step took 31 to 58 s.
      - name: Cache mt-cli build
        if: matrix.variant == 'homebrew'
        uses: actions/cache@v6
        with:
          path: tools/mt-cli/.build
          key: mt-cli-spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('tools/mt-cli/Package.swift', 'tools/mt-cli/Package.resolved') }}-${{ hashFiles('tools/mt-cli/Sources/**', 'tools/mt-cli/Tests/**') }}
      - name: mt-cli tests
        id: mt-cli-tests
        if: matrix.variant == 'homebrew'
        timeout-minutes: 5
        run: cd tools/mt-cli && swift test --parallel
      # Skipping on test failure is intentional — we never want a stale
      # coverage snapshot uploaded as if it were green.
      - uses: ./.github/actions/export-lcov
        if: success()
        with:
          package-dir: app/MeetingTranscriber
          flag: ${{ matrix.variant }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      # Cancels the run only when this leg's own build or tests failed, since
      # that is when the run is known red for a reason that needs a new push,
      # and the remaining legs are spent effort. A failure in setup (cache,
      # downloads) or in the shard-log upload is usually no verdict on the
      # code and a rerun of just that leg fixes it, so it does not take the
      # sibling leg and the other jobs down with it. One accepted limit: on a model-cache
      # miss the pre-warm in setup-swift-test compiles the test target, so a
      # compile error can fail there and then cancels nothing; the leg still
      # fails. A timed-out step shows as `timed_out` in the run summary, but
      # its `steps.<id>.outcome` is `failure`, so a hang that hits its step
      # timeout still cancels. One that runs into the 25 min job timeout first,
      # possible on a cold cache, ends the job `cancelled` and cancels nothing.
      - name: Cancel run on failure
        if: >-
          failure() && (
            steps.build-tests.outcome == 'failure' ||
            steps.swift-tests.outcome == 'failure' ||
            steps.mt-cli-tests.outcome == 'failure'
          )
        uses: ./.github/actions/cancel-on-failure
        with:
          job-name: test (${{ matrix.variant }})

  # AudioTapLib SPM library lives in `tools/audiotap/` and has its own
  # test suite (`tools/audiotap/Tests/`). Runs as its own top-level job
  # in parallel with `test` so wall-clock isn't gated by the app suite.
  # No matrix — the library is variant-agnostic (no -DAPPSTORE path),
  # so a single upload + `carryforward` in `.codecov.yml` is sufficient.
  audiotap-coverage:
    needs: changes
    # Fail closed; see the `changes` job for why this exact condition.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: xcode-27
    env:
      # Xcode 27.0 by its own path rather than /Applications/Xcode.app: the image also
      # ships 27.1 and a 27.2 beta, and a moved default must never reach a build here.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      # No ML model dependencies — a plain SPM cache keyed off the
      # manifest is enough to drop cold-compile cost on repeat runs.
      - uses: actions/cache@v6
        with:
          path: tools/audiotap/.build
          key: audiotap-spm-${{ runner.os }}-${{ hashFiles('tools/audiotap/Package.swift') }}
          restore-keys: |
            audiotap-spm-${{ runner.os }}-
      - name: Swift tests
        id: swift-tests
        timeout-minutes: 5
        run: cd tools/audiotap && swift test --parallel --enable-code-coverage
      - uses: ./.github/actions/export-lcov
        if: success()
        with:
          package-dir: tools/audiotap
          flag: audiotap
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      # Load-bearing, unlike in `lint` and `analyze`: this job is NOT a required
      # check, so cancelling the still-running required `test` legs is the only
      # way a failing AudioTapLib test blocks the merge (see the mt-cli step in
      # `test` for the limit of that). Scoped to the test step, so that a
      # failure elsewhere, such as the coverage export, does not take the
      # required legs down with it. The test step is not a pure library verdict
      # either: a stale or incompatible `.build` from the cache (restored through
      # restore-keys, or after an Xcode change, which the key does not carry)
      # also fails inside it, and then still cancels.
      - name: Cancel run on failure
        if: failure() && steps.swift-tests.outcome == 'failure'
        uses: ./.github/actions/cancel-on-failure
