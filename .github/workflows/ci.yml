name: CI

on:
  push:
    branches: [main, mac]
  pull_request:
    branches: [main]
  # Manual re-run knob (e.g. to re-trigger lint after a SwiftFormat config
  # bump). Background-QA jobs (sanitizer, quality) live in
  # `quality-and-safety.yml` with their own dispatch UI.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether anything outside docs/markdown changed. The filter only runs
  # for PR events; for push/tag/dispatch the step is skipped, leaving the step
  # output empty, and the job output falls back to 'true' so the full suite
  # always runs on non-PR triggers. Skipped required checks count as success
  # in branch protection, so docs-only PRs stay mergeable.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # Needed so dorny/paths-filter can read .github/filters.yml from the
      # workspace; the action otherwise hits the GitHub API for the file
      # list but still needs the filter definition locally.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # `every` is required for the exclusion-style filter in
          # .github/filters.yml: with the v4 default `some`, the `**`
          # catch-all alone marks every file as matched and the `!…`
          # negations never actually exclude anything, so docs-only PRs
          # still trigger the full build/test suite.
          predicate-quantifier: every
          filters: .github/filters.yml

  # Advisory by design: this job is NOT among the required checks and must never
  # be the thing that stops a merge. `main` is not at stake either way, and
  # scripts/ci/check-merge-commits.sh carries the reason. What it protects is the
  # review of the open PR, which a merge commit makes unreadable commit by commit.
  #
  # Two deliberate deviations from the house pattern in the jobs below:
  #   - No `Cancel run on failure` step. A check that blocks nothing must not take
  #     the macOS jobs down with it: the contributor still needs to see whether
  #     their actual change builds and passes.
  #   - Not gated on `changes`. A merge commit is worth reporting whichever files
  #     the PR touches, and this costs seconds on a free runner.
  merge-commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Three non-default inputs, each load-bearing. `ref`: the default
          # checkout for a pull_request event is refs/pull/N/merge, a merge commit
          # GitHub builds itself; measured on this repo, that ref carries a
          # `Merge <head> into <base>` commit, so the default would report every
          # PR. `fetch-depth: 0`: the depth-1 default carries neither the base
          # branch nor a merge base, so the commit range cannot resolve at all.
          # `filter: blob:none`: this walks commit topology only, so fetching
          # every historical file revision is dead weight.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
      # The base branch comes from the event rather than a hardcoded `main`, so
      # widening the `pull_request` trigger later cannot leave this silently
      # measuring against the wrong base. Passed via env rather than interpolated
      # into the command line.
      - name: Check for merge commits
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash scripts/ci/check-merge-commits.sh "origin/$BASE_REF"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      # Both linters are pinned to an exact release *and* an exact checksum,
      # rather than installed with `brew install`. Why: scripts/tool-versions.sh.
      # How: scripts/ci/install-lint-tool.sh. Verification is a separate step
      # because $GITHUB_PATH only takes effect for *later* steps, so a check in
      # the install step would assert against the binary the pin replaces.
      - name: Install pinned lint tools
        run: |
          bash scripts/ci/install-lint-tool.sh swiftlint
          bash scripts/ci/install-lint-tool.sh swiftformat
      - name: Verify pinned lint tools
        run: |
          bash scripts/ci/install-lint-tool.sh swiftlint --verify
          bash scripts/ci/install-lint-tool.sh swiftformat --verify
      # SwiftFormat path list lives in scripts/lint.sh; calling it keeps CI and
      # local lint runs aligned. SwiftLint stays an explicit step to use the
      # github-actions-logging reporter (annotations in the PR diff).
      - name: SwiftFormat
        run: bash scripts/lint.sh --format-only
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      # Globbed, not enumerated: the list used to name two of the four files and
      # nobody noticed, and a script test nobody runs is indistinguishable from
      # no test at all. The naming pattern is therefore the contract — a
      # scripts/tests/test_*.sh must be self-contained and finish in about a
      # second. The step runs under `bash -e`, so the first failure stops it.
      - name: Script regression tests
        run: |
          for t in scripts/tests/test_*.sh; do
            echo "==> $t"
            bash "$t"
          done
      - name: Cancel run on failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned SwiftLint
        run: bash scripts/ci/install-lint-tool.sh swiftlint
      - name: Verify pinned SwiftLint
        run: bash scripts/ci/install-lint-tool.sh swiftlint --verify
      - name: Build & Analyze
        run: |
          # pipefail: without it `xcodebuild ... | tee` masks an xcodebuild
          # failure, leaving swiftlint analyze to pass against an empty log.
          set -o pipefail
          cd app/MeetingTranscriber
          # SWIFT_SUPPRESS_WARNINGS=NO: without it xcodebuild fails outright on
          # AudioTapLib's warning gate. Reason at the flag in
          # tools/audiotap/Package.swift.
          xcodebuild -scheme MeetingTranscriber -destination 'platform=macOS' SWIFT_SUPPRESS_WARNINGS=NO build-for-testing 2>&1 | tee /tmp/xcodebuild.log
          cd "$GITHUB_WORKSPACE"
          swiftlint analyze --strict --compiler-log-path /tmp/xcodebuild.log --reporter github-actions-logging
      - name: Cancel run on failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    # 25 min job-timeout = 20 min setup (cold cache) + ~5 min margin. The
    # `Swift tests` step below has its own 18 min step-timeout so a hang
    # surfaces as `timed_out` (clearly distinguishable from cancellation),
    # not the opaque `cancelled` a bare job-timeout produces. See
    # docs/plans/.local/open/2026-05-11-job-timeout-visibility.md.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    strategy:
      # Both Homebrew and AppStore variants must pass. fail-fast: false NOT to
      # keep the sibling running on failure — the `Cancel run on failure` step
      # below cancels the whole run on any failure — but so the failing leg runs
      # that step and names itself the culprit in the run summary, instead of
      # being silently auto-cancelled by the matrix before it can.
      fail-fast: false
      matrix:
        variant: [homebrew, appstore]
        include:
          - variant: homebrew
            swift-flags: ""
          - variant: appstore
            swift-flags: "-Xswiftc -DAPPSTORE"
    name: test (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v7
      # 20 min covers SPM + ML cache restore plus the cold-cache pre-warm
      # download; well below the 25 min job timeout so a hung download
      # surfaces as a step failure, not a job-timeout.
      - uses: ./.github/actions/setup-swift-test
        timeout-minutes: 20
        with:
          cache-key-suffix: ${{ matrix.variant }}
          swift-flags: ${{ matrix.swift-flags }}
      # Without this the echo-cancellation tests skip, which is how this
      # feature reached a review with single-digit patch coverage on the two
      # files that do the work. The gap is worse than the number: the library
      # checks a model against a SHA-256 list compiled into it, so a model the
      # linked library rejects fails only at load time — compiling stays green,
      # the tests skip, and both builds merely copy the file. `appstore.yml`
      # already downloads the same model through `build_release.sh`, so this
      # adds no network dependency that CI did not have.
      - name: Fetch the echo-cancellation model
        run: echo "MEETINGTRANSCRIBER_LOCALVQE_MODEL=$(./scripts/fetch-localvqe-model.sh)" >> "$GITHUB_ENV"
      # 18 min step-timeout on the actual tests: typical hot-cache run is
      # 5–7 min, so this is ~3× margin while still failing fast as
      # `timed_out` (not `cancelled`) when a single test hangs.
      # `--enable-code-coverage` adds ~10–15 % runtime and writes a
      # `default.profdata` next to the xctest bundle.
      - name: Swift tests
        timeout-minutes: 18
        run: cd app/MeetingTranscriber && swift test --parallel --enable-code-coverage --skip ModelPreloadTests ${{ matrix.swift-flags }}
      # Skipping on test failure is intentional — we never want a stale
      # coverage snapshot uploaded as if it were green.
      - uses: ./.github/actions/export-lcov
        if: success()
        with:
          package-dir: app/MeetingTranscriber
          flag: ${{ matrix.variant }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      - name: Cancel run on failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
        with:
          job-name: test (${{ matrix.variant }})

  # AudioTapLib SPM library lives in `tools/audiotap/` and has its own
  # test suite (`tools/audiotap/Tests/`). Runs as its own top-level job
  # in parallel with `test` so wall-clock isn't gated by the app suite.
  # No matrix — the library is variant-agnostic (no -DAPPSTORE path),
  # so a single upload + `carryforward` in `.codecov.yml` is sufficient.
  audiotap-coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      # No ML model dependencies — a plain SPM cache keyed off the
      # manifest is enough to drop cold-compile cost on repeat runs.
      - uses: actions/cache@v6
        with:
          path: tools/audiotap/.build
          key: audiotap-spm-${{ runner.os }}-${{ hashFiles('tools/audiotap/Package.swift') }}
          restore-keys: |
            audiotap-spm-${{ runner.os }}-
      - name: Swift tests
        timeout-minutes: 5
        run: cd tools/audiotap && swift test --parallel --enable-code-coverage
      - uses: ./.github/actions/export-lcov
        if: success()
        with:
          package-dir: tools/audiotap
          flag: audiotap
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
      - name: Cancel run on failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
