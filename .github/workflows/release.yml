name: Build & Release DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirror of CI's path filter — see ci.yml for the full rationale. Push to
  # main, version tags, and workflow_dispatch fall through to `code = 'true'`
  # so they always build.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # Needed so dorny/paths-filter can read .github/filters.yml from the
      # workspace; see ci.yml for the same dance.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # `every` is required for the exclusion-style filter — without it,
          # the v4 default `some` makes `**` match every file and the `!…`
          # negations never apply, silently building DMGs for docs-only PRs.
          predicate-quantifier: every
          filters: .github/filters.yml

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26  # Apple Silicon runner (Swift 6.0+)
    timeout-minutes: 30
    strategy:
      matrix:
        variant: [homebrew, appstore]
        include:
          - variant: homebrew
            build-flags: ""
            dmg-prefix: "MeetingTranscriber"
          - variant: appstore
            build-flags: "--appstore --no-notarize"
            dmg-prefix: "MeetingTranscriber-AppStore"
    name: build (${{ matrix.variant }})
    permissions:
      contents: write  # For creating GitHub releases

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # Same SPM cache key as ci.yml — release builds reuse the test
      # matrix's resolved artifacts. ML models aren't loaded by
      # build_release.sh, so skip the model cache + prewarm.
      - uses: ./.github/actions/setup-swift-test
        with:
          cache-key-suffix: ${{ matrix.variant }}
          cache-models: "false"

      - name: Install Developer ID certificate
        id: dev-id
        uses: ./.github/actions/install-developer-id
        with:
          cert: ${{ secrets.DEVELOPER_ID_CERT }}
          cert-password: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}

      # The time-sensitive notification entitlement is RESTRICTED: codesign only
      # keeps it when a provisioning profile that grants it is embedded, and
      # silently drops it otherwise while still reporting success. Profiles are
      # account artifacts and gitignored, so without this step a release ships
      # with the entitlement missing and the browser-consent prompt stays
      # suppressed under Focus for every user — the exact bug it fixes.
      # Absent secret: prepare_signing takes its no-profile path and the build
      # still succeeds, so a fork release is not blocked by it.
      - name: Install provisioning profile
        if: matrix.variant == 'homebrew'
        env:
          PROFILE_B64: ${{ secrets.RELEASE_PROVISIONING_PROFILE }}
        run: |
          # Guarded here rather than in `if:` — the secrets context is not
          # dependable in step conditions, and the repo already gates
          # DEVELOPER_ID this way.
          if [ -z "${PROFILE_B64:-}" ]; then
            echo "No RELEASE_PROVISIONING_PROFILE secret — building without the entitlement."
            exit 0
          fi
          # shellcheck source=scripts/lib/signing.sh
          source scripts/lib/signing.sh
          # shellcheck source=scripts/lib/bundle-ids.sh
          source scripts/lib/bundle-ids.sh
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE_B64" \
            | base64 --decode > "$PROFILE_DIR/${RELEASE_BUNDLE_ID}.provisionprofile"
          echo "Installed profile for $RELEASE_BUNDLE_ID"

      - name: Build .app and DMG
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          # Tag builds: use tag as version and staple notarization for offline Gatekeeper
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_VERSION="--version=${GITHUB_REF_NAME#v}"
            STAPLE_FLAG="--staple"
          fi
          if [ "${{ matrix.variant }}" = "homebrew" ] && [ -n "${DEVELOPER_ID:-}" ]; then
            ./scripts/build_release.sh $STAPLE_FLAG ${BUILD_VERSION:-}
          else
            ./scripts/build_release.sh ${{ matrix.build-flags }} --no-notarize ${BUILD_VERSION:-}
          fi

      # Assert on the SHIPPED signature, not on the profile: a profile that
      # grants the key is necessary but not sufficient, and every other way the
      # entitlement gets dropped (unset DEVELOPER_ID, a plist edit that breaks,
      # a signing path that never reaches prepare_signing) is invisible to a
      # check on the input. verify_signing only warns, deliberately, so
      # contributor builds keep working — the release lane is the one caller
      # that has to fail.
      - name: Verify the release carries the time-sensitive entitlement
        if: matrix.variant == 'homebrew'
        env:
          PROFILE_B64: ${{ secrets.RELEASE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "${PROFILE_B64:-}" ]; then
            echo "No profile was installed — nothing to verify."
            exit 0
          fi
          # shellcheck source=scripts/lib/signing.sh
          source scripts/lib/signing.sh
          APP_BUNDLE=".build/release/MeetingTranscriber.app"
          if bundle_has_time_sensitive "$APP_BUNDLE"; then
            echo "Signature carries $TIME_SENSITIVE_KEY"
          else
            echo "::error::the built app is missing $TIME_SENSITIVE_KEY — the consent prompt would stay suppressed under Focus"
            exit 1
          fi

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          PRERELEASE=$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Compute DMG SHA256
        if: matrix.variant == 'homebrew'
        id: sha
        run: |
          DMG=".build/release/${{ matrix.dmg-prefix }}-${{ steps.version.outputs.version }}.dmg"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "DMG SHA256: $SHA"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dmg-prefix }}-${{ steps.version.outputs.version }}.dmg
          path: .build/release/${{ matrix.dmg-prefix }}-${{ steps.version.outputs.version }}.dmg
          retention-days: 3

      - name: Find previous release tag for changelog
        if: matrix.variant == 'homebrew' && startsWith(github.ref, 'refs/tags/v')
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          if [[ "$CURRENT_TAG" == *-* ]]; then
            # Prerelease (RC): find the immediately preceding tag (RC or stable)
            TAG=$(git tag --sort=-v:refname | awk -v cur="$CURRENT_TAG" 'found {print; exit} $0 == cur {found=1}')
          else
            # Stable release: find previous stable release only
            TAG=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || echo "")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: matrix.variant == 'homebrew' && startsWith(github.ref, 'refs/tags/v')
        # SHA-pinned: this is the highest-privilege third-party action in
        # release.yml — runs with DEVELOPER_ID_CERT, APP_PASSWORD,
        # TAP_REPO_TOKEN, APPLE_ID. SHA pin (vs tag pin) means a hijacked
        # v1 tag cannot retarget us to a malicious commit. Dependabot
        # bumps the SHA + comment in lockstep.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          # Idempotent re-runs: a partially-succeeded release job (e.g. the
          # tap-update step failing on an expired token) leaves this release
          # already created, so a `--failed` re-run would otherwise abort here
          # with `422 already_exists`. Updating instead lets the re-run reach the
          # downstream tap step. First runs have nothing to update.
          allowUpdates: true
          artifacts: .build/release/${{ matrix.dmg-prefix }}-${{ steps.version.outputs.version }}.dmg
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.prev.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            ## MeetingTranscriber ${{ steps.version.outputs.version }}${{ steps.version.outputs.prerelease == 'true' && ' (Pre-release)' || '' }}

            ### Installation

            **Via Homebrew (${{ steps.version.outputs.prerelease == 'true' && 'Beta channel' || 'recommended' }}):**
            ```bash
            brew tap pasrom/meeting-transcriber
            brew install --cask ${{ steps.version.outputs.prerelease == 'true' && 'meeting-transcriber@beta' || 'meeting-transcriber' }}
            ```

            > Homebrew 6.0+ may flag the third-party tap as untrusted. If so, run `brew trust --tap pasrom/meeting-transcriber` before installing.

            ${{ steps.version.outputs.prerelease == 'true' && '> Release candidate from the **beta channel**. The stable and beta casks conflict — uninstall one before installing the other.' || '' }}

            **Manual:**
            1. Download the DMG below
            2. Mount it and drag MeetingTranscriber to Applications

            ### SHA256
            ```
            ${{ steps.sha.outputs.sha256 }}
            ```

      # Gate stays loud: tap-update failure must fail the release —
      # otherwise `brew upgrade` silently keeps users on the prior version.
      - name: Update Homebrew tap with new version and SHA256
        id: tap-update
        if: matrix.variant == 'homebrew' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          PRERELEASE="${{ steps.version.outputs.prerelease }}"

          DMG=".build/release/MeetingTranscriber-${VERSION}.dmg"

          # Upload the DMG to the tap repo as well. Note the beta cask's url
          # still points at the MAIN repo's release, so beta installs depend on
          # that repo staying public — a mismatch worth normalising separately.
          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"

          gh release create "v${VERSION}" "$DMG" \
            --repo pasrom/homebrew-meeting-transcriber \
            --title "v${VERSION}" \
            --notes "DMG for Homebrew Cask distribution" \
            $PRERELEASE_FLAG \
            || gh release upload "v${VERSION}" "$DMG" \
              --repo pasrom/homebrew-meeting-transcriber --clobber

          # Clone the tap repo and update the appropriate Cask formula
          git clone https://x-access-token:${GH_TOKEN}@github.com/pasrom/homebrew-meeting-transcriber.git /tmp/tap
          cd /tmp/tap

          BETA_CASK="Casks/meeting-transcriber@beta.rb"
          STABLE_CASK="Casks/meeting-transcriber.rb"

          # Seed a cask from the source repo if the tap does not carry it yet.
          seed_cask() {
            if [ ! -f "$1" ]; then
              mkdir -p "$(dirname "$1")"
              cp "${GITHUB_WORKSPACE}/$1" "$1"
            fi
          }

          # Stages what it writes: a stable release can now touch two casks, so
          # the commit below stages nothing itself and has no single "the cask"
          # to name.
          write_cask() {
            seed_cask "$1"
            sed -i '' "s/version \".*\"/version \"${VERSION}\"/" "$1"
            sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" "$1"
            git add "$1"
            echo "Updated Cask formula ($1):"
            cat "$1"
          }

          if [ "$PRERELEASE" = "true" ]; then
            # A pre-release only ever moves the beta channel.
            write_cask "$BETA_CASK"
          else
            write_cask "$STABLE_CASK"

            # A stable release also carries the beta channel forward, but only
            # when it is actually newer. Without this the beta cask freezes at
            # the last RC: a cycle that ships without one (0.6.0 → 0.7.0 both
            # did) leaves beta users on older software than stable ones, with
            # `brew upgrade` reporting them up to date. The two casks
            # `conflicts_with` each other, so they cannot even install stable
            # alongside to escape it.
            #
            # The version guard is the load-bearing half. Mid-cycle the beta
            # channel legitimately runs ahead — with 0.8.0-rc1 published, a
            # 0.7.1 hotfix must not drag beta backwards.
            #
            # `sort -V` alone cannot decide this: it orders 0.8.0-rc1 *after*
            # 0.8.0, so the RC-to-stable step within one version — the most
            # common case there is — would read as "beta is ahead" and strand
            # exactly the users this change is for. So compare the release core
            # with sort -V, and settle an equal core by SemVer's rule that a
            # version without a pre-release suffix outranks one with it.
            # Call this only as an `if`/`elif` condition. errexit is suspended
            # for a function invoked that way, which is what lets the `[` tests
            # below answer "false" instead of killing the step; a bare call
            # would fail the release on every "leave alone" answer.
            stable_is_newer() {
              local beta="$1" stable="$2"
              [ "$beta" = "$stable" ] && return 1
              local beta_core="${beta%%-*}" stable_core="${stable%%-*}"
              local beta_pre="" stable_pre=""
              [ "$beta" != "$beta_core" ] && beta_pre="${beta#*-}"
              [ "$stable" != "$stable_core" ] && stable_pre="${stable#*-}"
              if [ "$beta_core" != "$stable_core" ]; then
                [ "$(printf '%s\n%s\n' "$beta_core" "$stable_core" | sort -V | tail -1)" = "$stable_core" ]
                return $?
              fi
              [ -z "$stable_pre" ] && [ -n "$beta_pre" ] && return 0
              [ -z "$beta_pre" ] && return 1
              [ "$(printf '%s\n%s\n' "$beta_pre" "$stable_pre" | sort -V | tail -1)" = "$stable_pre" ]
            }

            # Deliberately does NOT seed before reading. The source-repo file is
            # a template carrying a placeholder version and sha, so seeding first
            # would compare against a version that never shipped — and for any
            # stable below the template's number the comparison says "beta is
            # ahead", leaving a freshly seeded placeholder in the tree pointing
            # at a release that does not exist. A tap without the cask has no
            # beta users to strand, so write it outright.
            if [ ! -f "$BETA_CASK" ]; then
              echo "Tap carries no beta cask yet; seeding it at ${VERSION}."
              write_cask "$BETA_CASK"
            else
              BETA_VERSION="$(sed -n 's/^ *version "\(.*\)"/\1/p' "$BETA_CASK" | head -1)"
              if [ -z "$BETA_VERSION" ]; then
                # Discard before rewriting. `write_cask` repairs by substituting
                # the `version "..."` line, and the only way to reach here is
                # that no such line matched — so stamping in place would be a
                # silent no-op that commits the corrupt file and logs success.
                # Dropping it first makes `seed_cask` restore a well-formed
                # template, which then gets stamped.
                echo "WARNING: could not read a version out of ${BETA_CASK}; restoring it from the template at ${VERSION}."
                rm -f "$BETA_CASK"
                write_cask "$BETA_CASK"
              elif stable_is_newer "$BETA_VERSION" "$VERSION"; then
                echo "Stable ${VERSION} is newer than beta ${BETA_VERSION}; carrying the beta channel forward."
                write_cask "$BETA_CASK"
              else
                echo "Beta ${BETA_VERSION} is not behind stable ${VERSION}; leaving the beta channel alone."
              fi
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `write_cask` already staged whatever it touched. A re-run of an
          # already-successful release rewrites the same values, so stage
          # emptiness is the normal no-op case, not a failure.
          if git diff --cached --quiet; then
            echo "Cask formulae already at v${VERSION}; nothing to commit."
          else
            git commit -m "Update casks to v${VERSION}"
            git push
          fi

      - name: Cleanup keychain
        if: always() && steps.dev-id.outputs.keychain-path != ''
        run: security delete-keychain "${{ steps.dev-id.outputs.keychain-path }}" 2>/dev/null || true
